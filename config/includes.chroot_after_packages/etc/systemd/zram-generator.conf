# /etc/systemd/zram-generator.conf
# Swap comprimido en RAM (zram) de ZYRON. Sustituye por completo al archivo del paquete
# (/usr/lib/systemd/zram-generator.conf), que lo crearia en cualquier equipo.
# Opciones: man zram-generator.conf
#
# - Solo en equipos con 8 GiB de RAM o menos (MemTotal, en MiB): con mas memoria no aporta.
# - Tamano: la mitad de la RAM, como mucho 4 GiB. Es el tamano maximo de los datos sin
#   comprimir; la memoria que ocupa de verdad es la comprimida y solo cuando se usa.
# - zstd: la mejor compresion de las habituales con un coste de CPU razonable.
# - Prioridad 100: se usa antes que el archivo o la particion de intercambio del instalador
#   (prioridad negativa por defecto), que queda de reserva.
#
# Para desactivarlo: borra la seccion [zram0] (o deja este archivo vacio) y reinicia.
# Tambien se puede apagar en un arranque con el parametro del kernel systemd.zram=0.

[zram0]
host-memory-limit = 8192
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
