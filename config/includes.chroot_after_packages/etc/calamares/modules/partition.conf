---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"
userSwapChoices:
    - none
    - small
    - file
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
initialSwapChoice: file
defaultFileSystemType: "ext4"
# ext4 por defecto; Btrfs como opcion (subvolumenes en mount.conf e instantaneas con
# snapper: ver docs/recuperacion.md).
availableFileSystemTypes: [ "ext4", "btrfs" ]
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
# /boot sin cifrar: la clave se pide una sola vez, en la pantalla oscura de arranque,
# y GRUB no tiene que descifrar nada.
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1024M
    # "unknown": el sistema de archivos que elija el usuario (ext4 por defecto o Btrfs).
    - name: "sistema"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
