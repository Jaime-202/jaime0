---
backend: apt
update_db: false
update_system: false
operations:
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - user-setup
      - calamares
  # Lo que solo usa el instalador. El resto de Qt 6 se queda: lo necesita Quickshell
  # (aplicacion de ajustes y widgets). Comprobado con apt-get -s remove en Forky: quitar
  # qml6-module-qtquick, -controls, -layouts, -window, -templates, -qtqml-workerscript,
  # qt6-svg-plugins o libqt6svg6 desinstalaria Quickshell; qt6-wayland es su plataforma.
  - try_remove:
      - qml6-module-qtquick-effects
      - qml6-module-qt5compat-graphicaleffects
