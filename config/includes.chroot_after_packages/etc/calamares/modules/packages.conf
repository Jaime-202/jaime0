---
backend: apt
update_db: false
update_system: false
operations:
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - user-setup
      - calamares
  # Lo que solo usa el instalador: Qt 6, sus modulos QML y su tema.
  - try_remove:
      - qt6ct
      - qt6-wayland
      - qt6-svg-plugins
      - libqt6svg6
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-window
      - qml6-module-qtquick-effects
      - qml6-module-qtquick-templates
      - qml6-module-qtqml-workerscript
      - qml6-module-qt5compat-graphicaleffects
