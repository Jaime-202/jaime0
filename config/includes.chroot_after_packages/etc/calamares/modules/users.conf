---
userGroup: users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
autologinGroup: autologin
sudoersGroup: sudo
doAutologin: false
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false
passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: 128
user:
    shell: /bin/zsh
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "jaime0"
    forbidden_names: [ localhost ]
