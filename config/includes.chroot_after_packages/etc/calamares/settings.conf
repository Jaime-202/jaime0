---
modules-search: [ local ]

instances:
- id: grub
  module: shellprocess
  config: shellprocess_grub.conf
- id: limpieza
  module: shellprocess
  config: shellprocess_limpieza.conf
- id: snapper
  module: shellprocess
  config: shellprocess_snapper.conf

sequence:
- show:
  - welcomeq
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@grub
  - grubcfg
  - bootloader
  - packages
  - shellprocess@limpieza
  - shellprocess@snapper
  - plymouthcfg
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: hypr
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
