# ~/.config/starship.toml
# Prompt minimalista: directorio, rama y ❯ a la izquierda; duracion y hora a la derecha.
# Todo en grises; solo el ❯ va en verde (en rojo si la orden anterior fallo).

add_newline = true
palette = "jaime0"
format = "$directory$git_branch$git_status$character"
right_format = "$cmd_duration$status$time"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "fg:text bold"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
home_symbol = "~"
read_only = " "
read_only_style = "fg:yellow"

[git_branch]
format = "[ $branch]($style) "
style = "fg:subtext"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:yellow"

[character]
success_symbol = "[❯](fg:pink bold)"
error_symbol = "[❯](fg:red bold)"
vimcmd_symbol = "[❮](fg:green bold)"

[cmd_duration]
min_time = 2000
format = "[ $duration ](fg:overlay)"

[status]
disabled = false
format = "[ $status ]($style)"
style = "fg:red"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%H:%M:%S"
style = "fg:overlay"

[palettes.jaime0]
pink = "#54e58a"
green = "#54e58a"
yellow = "#d9a54a"
red = "#d9625b"
text = "#d8e2e8"
subtext = "#a7b4bc"
overlay = "#71818c"
