# ~/.config/hypr/hypridle.conf: inactividad de Jaime0 (la arranca "inactividad", que no
# hace nada en la sesion en vivo).
# Bloqueo a los 10 min, pantalla apagada a los 11 y suspension a los 30. Antes de
# suspender se bloquea siempre. Un video o una llamada que pidan no dormir lo impiden.

general {
    lock_cmd = bloquear
    before_sleep_cmd = loginctl lock-session || bloquear
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# A los 5 min avisa al motor de reglas del Control Center (evento "inactivo") y, al
# volver, "activo". Solo informa: lo que pase despues lo deciden tus reglas.
listener {
    timeout = 300
    on-timeout = jaime0-reglas evento inactivo
    on-resume = jaime0-reglas evento activo
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session || bloquear
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
