# ~/.config/hypr/hyprlock.conf: pantalla de bloqueo de ZYRON (la abre "bloquear").
# Reloj, fecha, cancion actual y clave sobre el fondo de escritorio difuminado y
# oscurecido. No se usa una captura de la pantalla: no deja ver lo que habia abierto y
# funciona con cualquier grafica (en algunas, la captura hace caer a hyprlock).
# El acento y el fondo salen de jaime0-ajustes; si el archivo generado falta, quedan
# el verde y el fondo de ZYRON.

$acento = rgb(54e58a)
$imagen = /usr/share/backgrounds/jaime0/jaime0.png
$texto = rgb(d8e2e8)
$gris = rgb(71818c)
$fondo = rgb(101519)
$borde = rgb(26343a)
$rojo = rgb(d9625b)
$ambar = rgb(d9a54a)
$fuente = JetBrainsMono Nerd Font
source = ~/.config/jaime0/generado/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    # Sin captura de pantalla (ver arriba): el fondo es la imagen del escritorio.
    disable_screencopy = true
}

animations {
    enabled = true
    bezier = suave, 0.25, 1.0, 0.5, 1.0
    animation = fadeIn, 1, 3, suave
    animation = fadeOut, 1, 3, suave
    animation = inputFieldDots, 1, 2, suave
}

background {
    monitor =
    path = $imagen
    color = rgb(080b0d)
    blur_passes = 2
    blur_size = 7
    brightness = 0.55
    noise = 0.0
}

# Hora
label {
    monitor =
    text = $TIME
    color = $texto
    font_size = 72
    font_family = $fuente
    position = 0, 150
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %-d de %B"
    color = $gris
    font_size = 14
    font_family = $fuente
    position = 0, 85
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $borde
    inner_color = $fondo
    font_color = $texto
    check_color = $acento
    fail_color = $rojo
    capslock_color = $ambar
    fade_on_empty = false
    rounding = 8
    font_family = $fuente
    placeholder_text = <span foreground="##71818c">Contraseña</span>
    fail_text = Contraseña incorrecta
    position = 0, -20
    halign = center
    valign = center
}

# Cancion que suena (vacia si no hay ninguna)
label {
    monitor =
    text = cmd[update:3000] cancion-actual
    color = $gris
    font_size = 11
    font_family = $fuente
    position = 0, 40
    halign = center
    valign = bottom
}
