# ~/.config/kitty/kitty.conf
# Paleta jaime0: fondo negro #080b0d casi opaco, texto gris claro y verde de acento.
# Cada terminal lleva abajo su etiqueta (la pestaña), con el nombre de lo que se ejecuta:
# zsh, nvim, btop...

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

hide_window_decorations yes
window_padding_width    8
# Casi opaco: el texto se lee nitido y Hyprland apenas tiene que difuminar.
background_opacity      0.95
dynamic_background_opacity no
confirm_os_window_close 0
enable_audio_bell       no
scrollback_lines        5000
copy_on_select          no
linux_display_server    wayland
wayland_titlebar_color  background
update_check_interval   0
repaint_delay           12
input_delay             2
sync_to_monitor         yes

# Etiqueta inferior, como un panel de TUI: numero en verde y titulo en gris
tab_bar_edge            bottom
tab_bar_style           separator
tab_separator           ""
tab_bar_min_tabs        1
tab_bar_margin_width    4
tab_bar_margin_height   2 0
tab_title_max_length    24
tab_title_template      " {fmt.fg._71818c}{fmt.bg._151c21} {index} {fmt.fg._a7b4bc}{fmt.bg._101519} {title} {fmt.fg.tab}{fmt.bg.default} "
active_tab_title_template " {fmt.fg._080b0d}{fmt.bg._54e58a} {index} {fmt.fg._d8e2e8}{fmt.bg._151c21} {title} {fmt.fg.tab}{fmt.bg.default} "
active_tab_font_style   bold
inactive_tab_font_style normal
active_tab_foreground   #d8e2e8
active_tab_background   #151c21
inactive_tab_foreground #71818c
inactive_tab_background #101519
tab_bar_background      none

foreground           #d8e2e8
background           #080b0d
selection_foreground #eef4f7
selection_background #26343a
cursor               #54e58a
cursor_text_color    #080b0d
url_color            #55cde0
active_border_color   #54e58a
inactive_border_color #26343a
bell_border_color     #d9a54a
mark1_foreground #080b0d
mark1_background #54e58a
mark2_foreground #080b0d
mark2_background #55cde0
mark3_foreground #080b0d
mark3_background #d9a54a

# Los 16 colores ANSI, apagados salvo el verde (normales y brillantes). Coinciden con la
# paleta de la consola (vt.default_* en auto/config), salvo el negro, que aqui es un gris
# muy oscuro para que se distinga del fondo.
color0  #151c21
color8  #71818c
color1  #d9625b
color9  #e8908a
color2  #54e58a
color10 #86efab
color3  #d9a54a
color11 #e8c27a
color4  #6a9fbf
color12 #8fb9d2
color5  #a68ab5
color13 #c2aacd
color6  #55cde0
color14 #8adcea
color7  #a7b4bc
color15 #eef4f7
