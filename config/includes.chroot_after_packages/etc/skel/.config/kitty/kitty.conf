# ~/.config/kitty/kitty.conf
# Paleta jaime0: fondo #12141d y acentos pastel. Cada terminal lleva abajo su etiqueta
# (la pestaña), con el nombre de lo que se ejecuta: zsh, nvim, btop...

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

hide_window_decorations yes
window_padding_width    8
background_opacity      0.72
dynamic_background_opacity no
confirm_os_window_close 0
enable_audio_bell       no
scrollback_lines        5000
copy_on_select          no
linux_display_server    wayland
wayland_titlebar_color  background
update_check_interval   0
repaint_delay           12
input_delay             2
sync_to_monitor         yes

# Etiqueta inferior, como un panel de TUI
tab_bar_edge            bottom
tab_bar_style           separator
tab_separator           ""
tab_bar_min_tabs        1
tab_bar_margin_width    4
tab_bar_margin_height   2 0
tab_title_max_length    24
tab_title_template      " {fmt.fg._12141d}{fmt.bg._7ab0ff} {index} {fmt.fg._7ab0ff}{fmt.bg._252939} {title} {fmt.fg.tab}{fmt.bg.default} "
active_tab_title_template " {fmt.fg._12141d}{fmt.bg._7ab0ff} {index} {fmt.fg._7ab0ff}{fmt.bg._252939} {title} {fmt.fg.tab}{fmt.bg.default} "
active_tab_font_style   bold
inactive_tab_font_style normal
active_tab_foreground   #7ab0ff
active_tab_background   #252939
inactive_tab_foreground #9aa0bc
inactive_tab_background #171a26
tab_bar_background      none

foreground           #e0e4f2
background           #12141d
selection_foreground #12141d
selection_background #7ab0ff
cursor               #7ab0ff
cursor_text_color    #12141d
url_color            #7ab0ff
active_border_color   #7ab0ff
inactive_border_color #2f3b52
bell_border_color     #a6cbff
mark1_foreground #12141d
mark1_background #7ab0ff
mark2_foreground #12141d
mark2_background #7ab0ff
mark3_foreground #12141d
mark3_background #a6cbff

# Negro, rojo, verde, ambar, azul, magenta, azul verdoso y blanco, todos apagados (normales y brillantes)
color0  #252939
color8  #565c78
color1  #c96a78
color9  #d99aa3
color2  #8fb39a
color10 #a9c7b3
color3  #c4ad75
color11 #d9c796
color4  #7ab0ff
color12 #a6cbff
color5  #a58aa8
color13 #c2adc4
color6  #7fb0bd
color14 #a3c8d2
color7  #b6bcd4
color15 #f2f4fb
