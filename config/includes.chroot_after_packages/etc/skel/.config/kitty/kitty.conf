# ~/.config/kitty/kitty.conf
# Paleta jaime0: fondo #12141d y acentos pastel. Cada terminal lleva abajo su etiqueta
# (la pestaña), con el nombre de lo que se ejecuta: zsh, nvim, btop...

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

hide_window_decorations yes
window_padding_width    8
background_opacity      0.72
dynamic_background_opacity no
confirm_os_window_close 0
enable_audio_bell       no
scrollback_lines        5000
copy_on_select          no
linux_display_server    wayland
wayland_titlebar_color  background
update_check_interval   0
repaint_delay           12
input_delay             2
sync_to_monitor         yes

# Etiqueta inferior, como un panel de TUI
tab_bar_edge            bottom
tab_bar_style           separator
tab_separator           ""
tab_bar_min_tabs        1
tab_bar_margin_width    4
tab_bar_margin_height   2 0
tab_title_max_length    24
tab_title_template      " {fmt.fg._12141d}{fmt.bg._b59bff} {index} {fmt.fg._b59bff}{fmt.bg._252939} {title} {fmt.fg.tab}{fmt.bg.default} "
active_tab_title_template " {fmt.fg._12141d}{fmt.bg._ff6ea9} {index} {fmt.fg._ff6ea9}{fmt.bg._252939} {title} {fmt.fg.tab}{fmt.bg.default} "
active_tab_font_style   bold
inactive_tab_font_style normal
active_tab_foreground   #ff6ea9
active_tab_background   #252939
inactive_tab_foreground #9aa0bc
inactive_tab_background #171a26
tab_bar_background      none

foreground           #e0e4f2
background           #12141d
selection_foreground #12141d
selection_background #b59bff
cursor               #ff6ea9
cursor_text_color    #12141d
url_color            #6ee7f2
active_border_color   #b59bff
inactive_border_color #343a52
bell_border_color     #ffe57a
mark1_foreground #12141d
mark1_background #b59bff
mark2_foreground #12141d
mark2_background #6ee7f2
mark3_foreground #12141d
mark3_background #ffe57a

# Negro, rojo, verde, amarillo, azul, rosa, cian y blanco (normales y brillantes)
color0  #252939
color8  #565c78
color1  #ff5c72
color9  #ff8a99
color2  #a6e87a
color10 #c3f2a0
color3  #ffe57a
color11 #fff0a8
color4  #7ab0ff
color12 #a6cbff
color5  #ff6ea9
color13 #b59bff
color6  #6ee7f2
color14 #a2f0f7
color7  #b6bcd4
color15 #f2f4fb
