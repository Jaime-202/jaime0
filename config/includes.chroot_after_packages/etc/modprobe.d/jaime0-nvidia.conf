# Jaime0: NVIDIA en modo "offload" (la Intel dibuja el escritorio).
# Debian instala los modulos con otro nombre de archivo (nvidia-current*) y las opciones
# van con ese nombre, como en su /etc/modprobe.d/nvidia-options.conf.
# Ahorro fino de energia (Turing): la grafica se apaga sola cuando nadie la usa.
options nvidia-current NVreg_DynamicPowerManagement=0x02
# Modo KMS: necesario para usar la salida HDMI, que va conectada a la NVIDIA.
options nvidia-current-drm modeset=1
