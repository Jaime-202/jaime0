# GRUB limpio y oscuro para el sistema instalado.
GRUB_TIMEOUT=2
GRUB_TIMEOUT_STYLE=menu
GRUB_DISTRIBUTOR="Jaime0"
# Muestra en el menu otros sistemas del disco, necesario para instalar junto a ellos.
GRUB_DISABLE_OS_PROBER=false
# La entrada de recuperacion arranca sin controlador grafico, a modo de modo seguro.
GRUB_CMDLINE_LINUX_RECOVERY="nomodeset"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0 vt.default_red=0x12,0xff,0xa6,0xff,0x7a,0xff,0x6e,0xe0,0x56,0xff,0xc3,0xff,0xa6,0xb5,0xa2,0xf2 vt.default_grn=0x14,0x5c,0xe8,0xe5,0xb0,0x6e,0xe7,0xe4,0x5c,0x8a,0xf2,0xf0,0xcb,0x9b,0xf0,0xf4 vt.default_blu=0x1d,0x72,0x7a,0x7a,0xff,0xa9,0xf2,0xf2,0x78,0x99,0xa0,0xa8,0xff,0xff,0xf7,0xfb"
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="white/blue"
GRUB_TERMINAL_OUTPUT="gfxterm"
GRUB_GFXMODE="auto"
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_THEME="/usr/share/grub/themes/hypr/theme.txt"
