# GRUB limpio y oscuro para el sistema instalado.
GRUB_TIMEOUT=2
GRUB_TIMEOUT_STYLE=menu
GRUB_DISTRIBUTOR="Jaime0"
# Muestra en el menu otros sistemas del disco, necesario para instalar junto a ellos.
GRUB_DISABLE_OS_PROBER=false
# La entrada de recuperacion arranca sin controlador grafico, a modo de modo seguro.
GRUB_CMDLINE_LINUX_RECOVERY="nomodeset"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0 vt.default_red=0x08,0xd9,0x54,0xd9,0x6a,0xa6,0x55,0xa7,0x71,0xe8,0x86,0xe8,0x8f,0xc2,0x8a,0xee vt.default_grn=0x0b,0x62,0xe5,0xa5,0x9f,0x8a,0xcd,0xb4,0x81,0x90,0xef,0xc2,0xb9,0xaa,0xdc,0xf4 vt.default_blu=0x0d,0x5b,0x8a,0x4a,0xbf,0xb5,0xe0,0xbc,0x8c,0x8a,0xab,0x7a,0xd2,0xcd,0xea,0xf7"
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="black/light-green"
GRUB_TERMINAL_OUTPUT="gfxterm"
GRUB_GFXMODE="auto"
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_THEME="/usr/share/grub/themes/hypr/theme.txt"
