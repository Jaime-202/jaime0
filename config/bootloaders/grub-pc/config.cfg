set default=0
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
else
    set gfxmode=auto
fi

# Con arranque seguro no se pueden cargar modulos: GRUB firmado ya trae los de video.
if [ "${lockdown}" != "y" ] ; then
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
